<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zigbee</title>
    <link rel="icon" type="image/svg+xml" href="/signalk-zigbee/icon.svg" />
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #ffffff;
        --text: #1d2330;
        --muted: #5f6b7a;
        --line: #dde2e8;
        --accent: #1f6feb;
        --ok: #1a7f37;
        --warn: #9a6700;
        --bad: #cf222e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #10141a;
          --card: #181d25;
          --text: #e6e9ee;
          --muted: #98a2b0;
          --line: #2a313c;
          --accent: #58a6ff;
          --ok: #3fb950;
          --warn: #d29922;
          --bad: #f85149;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.45 system-ui,
          sans-serif;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.3rem;
        margin: 0 0 12px;
      }
      .version {
        font-size: 0.8rem;
        font-weight: 400;
        margin-left: 6px;
      }
      section {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px 16px;
        margin-bottom: 14px;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
      }
      h2 {
        font-size: 1.05rem;
        margin: 0;
      }
      .muted {
        color: var(--muted);
      }
      .state {
        font-weight: 600;
      }
      .ok {
        color: var(--ok);
      }
      .warn {
        color: var(--warn);
      }
      .bad {
        color: var(--bad);
      }
      .actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      a,
      button {
        font: inherit;
        color: var(--accent);
      }
      button {
        background: none;
        border: 1px solid var(--accent);
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
      }
      .table {
        overflow-x: auto;
        margin-top: 10px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 6px 8px;
        border-top: 1px solid var(--line);
        vertical-align: top;
      }
      th {
        color: var(--muted);
        font-weight: 500;
      }
      code {
        font-size: 0.9em;
        word-break: break-all;
      }
      .rename {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .rename input {
        font: inherit;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 3px 8px;
        min-width: 0;
        flex: 1 1 10em;
      }
      .link {
        border: none;
        padding: 0;
        font-size: 0.9em;
      }
      .notice {
        margin: 10px 0 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Zigbee<span id="version" class="version muted"></span></h1>
      <div id="root" class="muted">Loading…</div>
    </main>
    <script>
      const API = "/plugins/signalk-zigbee/api";
      const root = document.getElementById("root");
      /** Web interface tokens; only an admin session can read them. */
      let tokens = {};
      let tokensDenied = false;
      /** Reading the tokens worked, so this session may rename devices. */
      let isAdmin = false;
      let lastStatus = null;
      /** { network, ieee, draft, error, busy } while a rename is open. */
      let editing = null;
      /** { network, text } after a rename. */
      let notice = null;

      function el(tag, attrs, ...children) {
        const node = document.createElement(tag);
        for (const [key, value] of Object.entries(attrs || {})) {
          if (key.startsWith("on") || key === "value" || key === "disabled")
            node[key] = value;
          else node.setAttribute(key, value);
        }
        for (const child of children) {
          if (child != null) node.append(child);
        }
        return node;
      }

      function stateOf(net) {
        if (net.phase === "running") {
          if (net.online === true) return ["online", "ok"];
          if (net.online === false) return ["Zigbee2MQTT offline", "bad"];
          return ["Zigbee2MQTT starting", "warn"];
        }
        if (net.phase === "error") return [net.message || "error", "bad"];
        if (net.phase === "disabled") return ["disabled", "muted"];
        return [net.message || net.phase, "warn"];
      }

      /** Opens pairing, or closes it with 0 seconds. */
      async function permitJoin(id, seconds, button) {
        button.disabled = true;
        try {
          const res = await fetch(
            `${API}/networks/${encodeURIComponent(id)}/permit-join`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ seconds }),
            },
          );
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            button.textContent = body.error || `Failed (${res.status})`;
            return;
          }
          // Zigbee2MQTT confirmed; the window comes back with the status.
          await refresh();
        } catch (err) {
          button.textContent = String(err);
        }
      }

      /** "3:52" for 232 seconds. */
      function clock(seconds) {
        const s = Math.max(0, Math.ceil(seconds));
        return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
      }

      // Count the pairing window down between two status refreshes.
      setInterval(() => {
        for (const node of document.querySelectorAll("[data-pairing-end]")) {
          const left = (Number(node.dataset.pairingEnd) - Date.now()) / 1000;
          node.textContent = `Pairing open, ${clock(left)}`;
        }
      }, 1000);

      function startRename(net, device) {
        editing = {
          network: net.id,
          ieee: device.ieeeAddress,
          draft: device.friendlyName,
          error: "",
          busy: false,
        };
        render(lastStatus);
        const input = root.querySelector(".rename input");
        input?.focus();
        input?.select();
      }

      function cancelRename() {
        editing = null;
        refresh();
      }

      async function saveRename() {
        const edit = editing;
        if (!edit || edit.busy) return;
        edit.busy = true;
        edit.error = "";
        render(lastStatus);
        try {
          const res = await fetch(
            `${API}/networks/${encodeURIComponent(edit.network)}` +
              `/devices/${encodeURIComponent(edit.ieee)}/rename`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ name: edit.draft }),
            },
          );
          const body = await res.json().catch(() => ({}));
          if (res.ok) {
            editing = null;
            notice = {
              network: edit.network,
              text:
                `Renamed to “${body.friendlyName}”, Signal K path ${body.basePath}. ` +
                "Values under an old path stay in the Data Browser until Signal K restarts.",
            };
            await refresh();
            return;
          }
          edit.error = body.error || `Failed (${res.status})`;
        } catch (err) {
          edit.error = String(err);
        }
        edit.busy = false;
        render(lastStatus);
      }

      function deviceCell(net, d) {
        if (editing?.network === net.id && editing.ieee === d.ieeeAddress) {
          const input = el("input", {
            value: editing.draft,
            maxlength: "64",
            "aria-label": "New name",
            disabled: editing.busy,
            oninput: (e) => (editing.draft = e.target.value),
            onkeydown: (e) => {
              if (e.key === "Enter") saveRename();
              if (e.key === "Escape") cancelRename();
            },
          });
          return el(
            "td",
            {},
            el(
              "div",
              { class: "rename" },
              input,
              el(
                "button",
                { onclick: saveRename, disabled: editing.busy },
                "Save",
              ),
              el(
                "button",
                { onclick: cancelRename, disabled: editing.busy },
                "Cancel",
              ),
            ),
            el("div", { class: "muted" }, d.ieeeAddress),
            editing.error ? el("div", { class: "bad" }, editing.error) : null,
          );
        }
        return el(
          "td",
          {},
          d.friendlyName,
          isAdmin && !editing
            ? el(
                "span",
                {},
                " ",
                el(
                  "button",
                  { class: "link", onclick: () => startRename(net, d) },
                  "Rename",
                ),
              )
            : null,
          el("div", { class: "muted" }, d.ieeeAddress),
        );
      }

      function network(net) {
        const [label, cls] = stateOf(net);
        const token = tokens[net.id];
        const frontend =
          `${location.protocol}//${location.hostname}:${net.frontendPort}/` +
          (token ? `?token=${encodeURIComponent(token)}` : "");
        const pairing = net.pairingSeconds !== undefined;
        const pair = el(
          "button",
          {},
          pairing ? "Stop pairing" : "Allow pairing",
        );
        pair.onclick = () => permitJoin(net.id, pairing ? 0 : 254, pair);
        // The end in this browser's clock, so the countdown ignores any
        // clock difference to the server.
        const countdown = pairing
          ? el(
              "span",
              {
                class: "ok",
                "data-pairing-end": String(
                  Date.now() + net.pairingSeconds * 1000,
                ),
              },
              `Pairing open, ${clock(net.pairingSeconds)}`,
            )
          : null;
        const rows = net.devices.map((d) =>
          el(
            "tr",
            {},
            deviceCell(net, d),
            el("td", {}, [d.vendor, d.model].filter(Boolean).join(" ")),
            el(
              "td",
              {},
              d.enabled
                ? el("code", {}, d.basePath)
                : el("span", { class: "muted" }, "not published"),
            ),
            el("td", {}, String(d.paths.length)),
          ),
        );
        return el(
          "section",
          {},
          el(
            "header",
            {},
            el("h2", {}, net.id),
            el("span", { class: `state ${cls}` }, label),
            el(
              "span",
              { class: "muted" },
              net.coordinator === "espos"
                ? `espOS ${net.coordinatorAddress || ""}`
                : "USB",
            ),
            el(
              "span",
              { class: "actions" },
              net.phase === "running" ? countdown : null,
              net.phase === "running" ? pair : null,
              net.phase === "running"
                ? el(
                    "a",
                    { href: frontend, target: "_blank", rel: "noopener" },
                    "Zigbee2MQTT ↗",
                  )
                : null,
            ),
          ),
          notice?.network === net.id
            ? el("p", { class: "notice ok" }, notice.text)
            : null,
          rows.length
            ? el(
                "div",
                { class: "table" },
                el(
                  "table",
                  {},
                  el(
                    "thead",
                    {},
                    el(
                      "tr",
                      {},
                      el("th", {}, "Device"),
                      el("th", {}, "Model"),
                      el("th", {}, "Signal K path"),
                      el("th", {}, "Values"),
                    ),
                  ),
                  el("tbody", {}, ...rows),
                ),
              )
            : el("p", { class: "muted" }, "No devices paired yet."),
        );
      }

      function render(status) {
        if (!status) return;
        lastStatus = status;
        if (status.version) {
          document.getElementById("version").textContent = `v${status.version}`;
        }
        const nodes = [];
        if (status.problems.length) {
          nodes.push(
            el(
              "section",
              {},
              el("p", { class: "bad" }, status.problems.join(" ")),
            ),
          );
        }
        if (!status.running) {
          nodes.push(el("p", { class: "muted" }, "The plugin is not running."));
        } else if (!status.networks.length) {
          nodes.push(
            el(
              "p",
              { class: "muted" },
              "No network configured. Add one under Server → Plugin Config → Zigbee.",
            ),
          );
        }
        nodes.push(...status.networks.map(network));
        if (status.discovered.length) {
          nodes.push(
            el(
              "section",
              {},
              el("h2", {}, "espOS coordinators not in use"),
              ...status.discovered.map((c) =>
                el(
                  "p",
                  {},
                  `${c.name} — ${c.address}:${c.port}${c.deviceId ? ` (id ${c.deviceId})` : ""}`,
                ),
              ),
            ),
          );
        }
        root.className = "";
        root.replaceChildren(...nodes);
      }

      async function loadTokens() {
        try {
          const res = await fetch(`${API}/frontend-tokens`, {
            credentials: "same-origin",
          });
          if (res.ok) {
            tokens = await res.json();
            isAdmin = true;
          } else if (res.status === 401 || res.status === 403) {
            // Not (or no longer) an admin: drop tokens an earlier session saw.
            tokens = {};
            tokensDenied = true;
            isAdmin = false;
          }
        } catch {
          // Keep the last tokens; the links still work without one.
        }
      }

      async function refresh() {
        // Re-rendering would throw away the name being typed.
        if (editing) return;
        try {
          if (!tokensDenied) await loadTokens();
          const res = await fetch(`${API}/status`, {
            credentials: "same-origin",
          });
          if (res.status === 401 || res.status === 403) {
            root.textContent = "Log in to Signal K to see the Zigbee networks.";
            return;
          }
          const status = await res.json();
          if (!editing) render(status);
        } catch (err) {
          root.textContent = `Status unavailable: ${err}`;
        }
      }

      refresh();
      setInterval(refresh, 5000);
    </script>
  </body>
</html>
